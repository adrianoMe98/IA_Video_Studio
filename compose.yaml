name: ia-video
services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    image: ia-video-studio:1.3-local
    container_name: ia-video-studio
    init: true
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${STUDIO_PORT:-8787}:8787"
    volumes:
      - ./studio-data:/data
    environment:
      STUDIO_DATA: /data
      STUDIO_VOICES: /data/voices
      PYTHONUNBUFFERED: "1"
      HOME: /tmp
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      XDG_CACHE_HOME: /tmp/cache
    shm_size: 512mb
    mem_limit: ${STUDIO_MEMORY_LIMIT:-8g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 35s
      retries: 3
    security_opt:
      - no-new-privileges:true
  voice-download:
    profiles: ["tools"]
    image: ia-video-studio:1.3-local
    build:
      context: .
      dockerfile: Dockerfile.studio
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint: ["python", "/opt/studio/download_voice.py"]
    command: ["--all"]
    volumes:
      - ./studio-data:/data
    environment:
      STUDIO_VOICES: /data/voices
      HOME: /tmp
  ollama:
    profiles: ["roteiro-ia"]
    image: ollama/ollama:latest
    container_name: ia-video-ollama
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 4g
    # A porta 11434 não é publicada no host.
volumes:
  ollama-models:
